<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF8">
<title>晴暢集團 員工系統</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  /* ---------- 金萱字型（同目錄 woff2 瘦身檔） ---------- */
  @font-face{
    font-family:"JinXuan";
    src:url("jinxuan_subset.woff2") format("woff2");
    font-weight:600;
    font-display:swap;
  }

  :root{
    /* 固定文字用金萱；動態姓名用系統字型 */
    --font-display: "JinXuan", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-system:  -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;

    /* ---- 底色：暖白（取自思庭新版 #FCF9F5） ---- */
    --bg:            #FBFAF8;
    --surface:       #FFFFFF;
    --surface-tint:  #FDFCFB;

    /* ---- 藍：倫倫體學 霧藍系 ---- */
    --blue:          #6BA3C9;
    --blue-deep:     #33557E;
    --blue-soft:     #DCEAF3;
    --blue-wash:     #EEF6FA;

    /* ---- 粉：思庭泌乳 藕粉玫瑰系（新版官網） ---- */
    --rose:          #C39393;
    --rose-deep:     #A07C7C;
    --rose-soft:     #F0E0E0;
    --rose-wash:     #FAF1F1;

    /* ---- 文字：暖調中性（呼應思庭 #664A40） ---- */
    --ink:           #4A423D;
    --ink-soft:      #7C736D;
    --ink-faint:     #ABA29B;

    --line:          #EFEAE5;
    --radius-lg:     22px;
    --shadow:        0 1px 2px rgba(102, 74, 64, .04),
                     0 8px 22px rgba(102, 74, 64, .06);
    --shadow-hover:  0 2px 4px rgba(102, 74, 64, .05),
                     0 14px 30px rgba(102, 74, 64, .11);

    /* 卡片預設走藍色，個別卡片以 class 覆寫 */
    --c:      var(--blue);
    --c-deep: var(--blue-deep);
    --c-soft: var(--blue-soft);
    --c-wash: var(--blue-wash);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    min-height:100dvh;
    font-family:var(--font-display);
    color:var(--ink);
    background:var(--bg);
    /* 頂部光暈：左邊霧藍（倫倫）、右邊藕粉（思庭），都極淡 */
    background-image:
      radial-gradient(105% 44% at 16% -10%, #E6F1F8 0%, rgba(230,241,248,0) 62%),
      radial-gradient(88% 40% at 98% -6%, #F7EAEA 0%, rgba(247,234,234,0) 60%);
    background-repeat:no-repeat;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }

  .wrap{
    width:100%;
    max-width:500px;
    margin-inline:auto;
    text-align:center;
    padding:
      calc(env(safe-area-inset-top) + 30px)
      20px
      calc(env(safe-area-inset-bottom) + 48px);
  }

  /* ---------- 頂部 ---------- */
  .brandbar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin-bottom:26px;
  }
  .brandbar .dot{
    width:27px; height:27px;
    flex:0 0 auto;
    border-radius:9px;
    background:linear-gradient(140deg, #8FBDDA 0%, var(--blue) 100%);
    display:grid; place-items:center;
    box-shadow:0 3px 9px rgba(107,163,201,.28);
  }
  .brandbar .dot svg{ width:15px; height:15px; }
  .brandbar span{
    font-size:14px;
    letter-spacing:.07em;
    color:var(--ink-soft);
    font-weight:600;
  }

  .hello{
    margin:0 0 7px;
    font-size:27px;
    font-weight:700;
    letter-spacing:.01em;
    line-height:1.35;
    color:var(--ink);
  }
  /* 姓名為動態內容（LIFF 帶入），改用系統字型避免瘦身字型缺字 */
  .hello .name{
    color:#5F534C;
    font-family:var(--font-system);
  }
  .hello .wave{
    display:inline-block;
    font-size:24px;
    margin-left:2px;
  }
  .subtitle{
    margin:0;
    font-size:14.5px;
    color:var(--ink-soft);
  }

  .divider{
    height:1px;
    background:linear-gradient(90deg, rgba(240,224,224,0), var(--rose-soft) 50%, rgba(240,224,224,0));
    margin:26px auto 20px;
    width:100%;
    border:0;
  }

  .section-label{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.14em;
    color:var(--ink-faint);
    margin:0 0 14px 2px;
  }
  .section-label::before{
    content:"";
    width:5px; height:5px;
    border-radius:50%;
    background:var(--rose);
    opacity:.8;
  }

  /* ---------- 功能卡片 ---------- */
  .cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
  }

  .card{
    -webkit-appearance:none;
    appearance:none;
    font:inherit;
    color:inherit;
    text-align:center;
    font-family:var(--font-display);
    text-decoration:none;
    width:100%;
    cursor:pointer;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:13px;
    padding:26px 12px 24px;
    min-height:150px;

    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);

    transition:transform .18s ease, box-shadow .18s ease,
               border-color .18s ease, background-color .18s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .card .icon{
    flex:0 0 auto;
    width:66px; height:66px;
    border-radius:21px;
    background:var(--c-wash);
    border:1px solid var(--c-soft);
    display:grid; place-items:center;
    color:var(--c);
    transition:background-color .18s ease, color .18s ease, border-color .18s ease;
  }
  .card .icon svg{
    width:33px; height:33px;
    display:block;
  }

  .card .title{
    display:block;
    font-size:17px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--ink);
    line-height:1.3;
  }

  @media (hover:hover){
    .card:hover{
      transform:translateY(-2px);
      box-shadow:var(--shadow-hover);
      border-color:var(--c-soft);
      background:var(--surface-tint);
    }
    .card:hover .icon{
      background:var(--c);
      border-color:var(--c);
      color:#fff;
    }
    .card:hover .title{ color:var(--c-deep); }
  }

  .card:active{
    transform:scale(.985);
    box-shadow:0 1px 2px rgba(102,74,64,.05);
    background:var(--c-wash);
    border-color:var(--c-soft);
  }

  .card:focus-visible{
    outline:2.5px solid var(--c);
    outline-offset:3px;
  }

  /* 資訊類卡片：走思庭藕粉色 */
  .card.is-rose{
    --c:      var(--rose);
    --c-deep: var(--rose-deep);
    --c-soft: var(--rose-soft);
    --c-wash: var(--rose-wash);
  }

  /* ---------- LIFF 除錯面板（測試用，之後移除） ---------- */
  .debug{
    margin-top:26px;
    padding:14px 16px;
    border-radius:16px;
    border:1px dashed var(--line);
    background:var(--surface);
    text-align:left;
    font-size:12.5px;
    line-height:1.75;
    color:var(--ink-soft);
    word-break:break-all;
  }
  .debug h2{
    margin:0 0 8px;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.14em;
    color:var(--ink-faint);
  }
  .debug .row{ display:flex; gap:8px; }
  .debug .k{
    flex:0 0 auto;
    min-width:76px;
    color:var(--ink-faint);
  }
  .debug .v{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:12px;
    color:var(--ink);
  }
  .debug.is-ok{    border-color:var(--blue-soft); background:var(--blue-wash); }
  .debug.is-warn{  border-color:var(--rose-soft); background:var(--rose-wash); }
  .debug.is-error{ border-color:#E8B4B4; background:#FDF0F0; }

  /* ---------- 頁尾 ---------- */
  .foot{
    margin-top:34px;
    text-align:center;
    font-size:12px;
    color:var(--ink-faint);
    letter-spacing:.04em;
  }

  /* ---------- 平板以上：兩欄 ---------- */
  @media (min-width:640px){
    .wrap{ padding-top:54px; }
    .hello{ font-size:30px; }
    .cards{ gap:16px; }
    .card{ padding:32px 16px 30px; min-height:172px; gap:15px; }
    .card .icon{ width:72px; height:72px; border-radius:23px; }
    .card .icon svg{ width:36px; height:36px; }
    .card .title{ font-size:18px; }
  }

  @media (prefers-reduced-motion:reduce){
    .card,.card .icon{ transition:none; }
    .card:hover,.card:active{ transform:none; }
  }
</style>
</head>
<body>

<main class="wrap">

  <!-- 頂部：集團名稱 -->
  <div class="brandbar">
    <span class="dot" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
        <circle cx="12" cy="12" r="3.4"/>
      </svg>
    </span>
    <span>晴暢集團　員工系統</span>
  </div>

  <!-- 頂部：問候 -->
  <h1 class="hello">哈囉 <span class="name" id="userName">載入中…</span><span class="wave">👋</span></h1>
  <p class="subtitle">今天也辛苦了，需要什麼從下面選就好</p>

  <hr class="divider">

  <p class="section-label">功能選單</p>

  <!-- 功能卡片（靜態，尚未連結） -->
  <div class="cards">

    <!-- 假勤類：霧藍 -->
    <button type="button" class="card">
      <span class="icon" aria-hidden="true">
        <!-- 月曆 -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="3"/>
          <path d="M3 10h18M8 3v4M16 3v4"/>
          <path d="M8 14.5h.01M12 14.5h.01M16 14.5h.01M8 18h.01M12 18h.01"/>
        </svg>
      </span>
      <span class="title">預休登記</span>
    </button>

    <button type="button" class="card">
      <span class="icon" aria-hidden="true">
        <!-- 文件 + 打勾 -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2.5 2.5 0 0 0-2.5 2.5v13A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V8.5z"/>
          <path d="M14 3v4a1.5 1.5 0 0 0 1.5 1.5h4"/>
          <path d="M8.6 15.2l2 2 4-4.4"/>
        </svg>
      </span>
      <span class="title">請假申請</span>
    </button>

    <!-- 資訊類：藕粉 -->
    <button type="button" class="card is-rose">
      <span class="icon" aria-hidden="true">
        <!-- 資料夾 -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2a2 2 0 0 1 1.5.7l1.1 1.3h7.2A2.5 2.5 0 0 1 21 9.5v8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/>
          <path d="M3 11h18"/>
        </svg>
      </span>
      <span class="title">開會內容</span>
    </button>

    <button type="button" class="card is-rose">
      <span class="icon" aria-hidden="true">
        <!-- 文件 + 資訊 -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2.5 2.5 0 0 0-2.5 2.5v13A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V8.5z"/>
          <path d="M14 3v4a1.5 1.5 0 0 0 1.5 1.5h4"/>
          <path d="M12 16.6v-3.1M12 11.1h.01"/>
        </svg>
      </span>
      <span class="title">月中介紹</span>
    </button>

  </div>

  <!-- LIFF 測試面板：確認身分有沒有抓到，確認完可整段刪除 -->
  <section class="debug" id="debugBox">
    <h2>LIFF 連線測試</h2>
    <div class="row"><span class="k">狀態</span><span class="v" id="dbgStatus">初始化中…</span></div>
    <div class="row"><span class="k">暱稱</span><span class="v" id="dbgName">—</span></div>
    <div class="row"><span class="k">userId</span><span class="v" id="dbgUid">—</span></div>
    <div class="row"><span class="k">開啟環境</span><span class="v" id="dbgEnv">—</span></div>
  </section>

  <p class="foot">晴暢國際有限公司　內部使用</p>

</main>

<script>
(function(){
  var LIFF_ID = "2011467420-8ej4byB6";

  var elName   = document.getElementById("userName");
  var elBox    = document.getElementById("debugBox");
  var elStatus = document.getElementById("dbgStatus");
  var elDbgName= document.getElementById("dbgName");
  var elUid    = document.getElementById("dbgUid");
  var elEnv    = document.getElementById("dbgEnv");

  function setState(cls, status){
    elBox.className = "debug " + cls;
    elStatus.textContent = status;
  }

  // 記錄「已嘗試過登入跳轉」，避免登入失敗時來回無限跳轉
  var LOGIN_FLAG = "liff_login_redirected";
  function getFlag(k){   try { return sessionStorage.getItem(k); } catch(e){ return null; } }
  function setFlag(k){   try { sessionStorage.setItem(k, "1"); } catch(e){} }
  function clearFlag(k){ try { sessionStorage.removeItem(k); }  catch(e){} }

  // SDK 沒載到（擋廣告的外掛、離線等）
  if (typeof liff === "undefined") {
    elName.textContent = "訪客";
    setState("is-error", "LIFF SDK 載入失敗，請檢查網路連線");
    return;
  }

  liff.init({ liffId: LIFF_ID })
    .then(function(){
      elEnv.textContent =
        (liff.isInClient() ? "LINE App 內" : "一般瀏覽器") +
        "　OS:" + liff.getOS() +
        "　v" + liff.getVersion();

      // 未登入（外部瀏覽器開啟）→ 導向 LINE 登入，登入後自動回到本頁
      if (!liff.isLoggedIn()) {
        // 防呆：若登入後回來仍是未登入狀態，就停下來，避免無限跳轉
        if (getFlag(LOGIN_FLAG)) {
          clearFlag(LOGIN_FLAG);
          elName.textContent = "訪客";
          setState("is-error",
            "已完成 LINE 登入但仍取不到身分，請確認瀏覽器允許 Cookie，或改用 LINE 開啟");
          return;
        }
        setFlag(LOGIN_FLAG);
        elName.textContent = "訪客";
        setState("is-warn", "尚未登入，導向 LINE 登入中…");
        liff.login();   // 跳轉離開本頁，之後的程式不會執行
        return;
      }

      clearFlag(LOGIN_FLAG);

      return liff.getProfile()
        .then(function(profile){
          elName.textContent    = profile.displayName;
          elDbgName.textContent = profile.displayName;
          elUid.textContent     = profile.userId;
          setState("is-ok", "成功抓到身分 ✓");
        })
        .catch(function(err){
          elName.textContent = "訪客";
          setState("is-error", "getProfile 失敗：" + (err && (err.message || err.code) || err));
        });
    })
    .catch(function(err){
      elName.textContent = "訪客";
      elEnv.textContent  = "—";
      setState("is-error", "liff.init 失敗：" + (err && (err.message || err.code) || err));
    });
})();
</script>

</body>
</html>
