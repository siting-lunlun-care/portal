<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF8">
<title>晴暢集團 員工系統</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  /* ---------- 金萱字型（同目錄 woff2 瘦身檔） ---------- */
  @font-face{
    font-family:"JinXuan";
    src:url("jinxuan_subset.woff2") format("woff2");
    font-weight:600;
    font-display:swap;
  }

  :root{
    /* 固定文字用金萱；動態姓名用系統字型 */
    --font-display: "JinXuan", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-system:  -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;

    /* ---- 底色：暖白（取自思庭新版 #FCF9F5） ---- */
    --bg:            #FBFAF8;
    --surface:       #FFFFFF;
    --surface-tint:  #FDFCFB;

    /* ---- 藍：倫倫體學 霧藍系 ---- */
    --blue:          #6BA3C9;
    --blue-deep:     #33557E;
    --blue-soft:     #DCEAF3;
    --blue-wash:     #EEF6FA;

    /* ---- 粉：思庭泌乳 藕粉玫瑰系（新版官網） ---- */
    --rose:          #C39393;
    --rose-deep:     #A07C7C;
    --rose-soft:     #F0E0E0;
    --rose-wash:     #FAF1F1;

    /* ---- 文字：暖調中性（呼應思庭 #664A40） ---- */
    --ink:           #4A423D;
    --ink-soft:      #7C736D;
    --ink-faint:     #ABA29B;

    --line:          #EFEAE5;
    --radius-lg:     22px;
    --shadow:        0 1px 2px rgba(102, 74, 64, .04),
                     0 8px 22px rgba(102, 74, 64, .06);
    --shadow-hover:  0 2px 4px rgba(102, 74, 64, .05),
                     0 14px 30px rgba(102, 74, 64, .11);

    /* 卡片預設走藍色，個別卡片以 class 覆寫 */
    --c:      var(--blue);
    --c-deep: var(--blue-deep);
    --c-soft: var(--blue-soft);
    --c-wash: var(--blue-wash);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    min-height:100dvh;
    font-family:var(--font-display);
    color:var(--ink);
    background:var(--bg);
    /* 頂部光暈：左邊霧藍（倫倫）、右邊藕粉（思庭），都極淡 */
    background-image:
      radial-gradient(105% 44% at 16% -10%, #E6F1F8 0%, rgba(230,241,248,0) 62%),
      radial-gradient(88% 40% at 98% -6%, #F7EAEA 0%, rgba(247,234,234,0) 60%);
    background-repeat:no-repeat;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }

  .wrap{
    width:100%;
    max-width:500px;
    margin-inline:auto;
    text-align:center;
    padding:
      calc(env(safe-area-inset-top) + 30px)
      20px
      calc(env(safe-area-inset-bottom) + 48px);
  }

  /* ---------- 頂部 ---------- */
  .brandbar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin-bottom:26px;
  }
  .brandbar .dot{
    width:27px; height:27px;
    flex:0 0 auto;
    border-radius:9px;
    background:linear-gradient(140deg, #8FBDDA 0%, var(--blue) 100%);
    display:grid; place-items:center;
    box-shadow:0 3px 9px rgba(107,163,201,.28);
  }
  .brandbar .dot svg{ width:15px; height:15px; }
  .brandbar span{
    font-size:14px;
    letter-spacing:.07em;
    color:var(--ink-soft);
    font-weight:600;
  }

  .hello{
    margin:0 0 7px;
    font-size:27px;
    font-weight:700;
    letter-spacing:.01em;
    line-height:1.35;
    color:var(--ink);
  }
  /* 姓名為動態內容（LIFF 帶入），改用系統字型避免瘦身字型缺字 */
  .hello .name{
    color:#5F534C;
    font-family:var(--font-system);
  }
  .hello .wave{
    display:inline-block;
    font-size:24px;
    margin-left:2px;
  }
  .subtitle{
    margin:0;
    font-size:14.5px;
    color:var(--ink-soft);
  }

  .divider{
    height:1px;
    background:linear-gradient(90deg, rgba(240,224,224,0), var(--rose-soft) 50%, rgba(240,224,224,0));
    margin:26px auto 20px;
    width:100%;
    border:0;
  }

  .section-label{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.14em;
    color:var(--ink-faint);
    margin:0 0 14px 2px;
  }
  .section-label::before{
    content:"";
    width:5px; height:5px;
    border-radius:50%;
    background:var(--rose);
    opacity:.8;
  }

  /* ---------- 功能卡片 ---------- */
  .cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
  }

  .card{
    -webkit-appearance:none;
    appearance:none;
    font:inherit;
    color:inherit;
    text-align:center;
    font-family:var(--font-display);
    text-decoration:none;
    width:100%;
    cursor:pointer;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:13px;
    padding:26px 12px 24px;
    min-height:150px;

    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);

    transition:transform .18s ease, box-shadow .18s ease,
               border-color .18s ease, background-color .18s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .card .icon{
    flex:0 0 auto;
    width:66px; height:66px;
    border-radius:21px;
    background:var(--c-wash);
    border:1px solid var(--c-soft);
    display:grid; place-items:center;
    color:var(--c);
    transition:background-color .18s ease, color .18s ease, border-color .18s ease;
  }
  .card .icon svg{
    width:33px; height:33px;
    display:block;
  }

  .card .title{
    display:block;
    font-size:17px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--ink);
    line-height:1.3;
  }

  @media (hover:hover){
    .card:hover{
      transform:translateY(-2px);
      box-shadow:var(--shadow-hover);
      border-color:var(--c-soft);
      background:var(--surface-tint);
    }
    .card:hover .icon{
      background:var(--c);
      border-color:var(--c);
      color:#fff;
    }
    .card:hover .title{ color:var(--c-deep); }
  }

  .card:active{
    transform:scale(.985);
    box-shadow:0 1px 2px rgba(102,74,64,.05);
    background:var(--c-wash);
    border-color:var(--c-soft);
  }

  .card:focus-visible{
    outline:2.5px solid var(--c);
    outline-offset:3px;
  }

  /* 依部門隱藏（.card 與 .section-label 都是 flex，需明確蓋掉 hidden 屬性） */
  .card[hidden],
  .section-label[hidden]{ display:none; }

  /* 顯示張數為奇數時，最後一張撐滿整列，右邊才不會留空 */
  .card.is-wide{ grid-column:1 / -1; }

  /* 尚未開放的功能，點擊後的提示 */
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(env(safe-area-inset-bottom) + 26px);
    transform:translate(-50%, 12px);
    max-width:calc(100% - 40px);
    padding:11px 20px;
    border-radius:999px;
    background:rgba(74,66,61,.93);
    color:#fff;
    font-size:13.5px;
    letter-spacing:.03em;
    white-space:nowrap;
    box-shadow:0 6px 20px rgba(74,66,61,.28);
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:50;
  }
  .toast.is-on{ opacity:1; transform:translate(-50%, 0); }

  /* 查無資料／錯誤提示 */
  .notice{
    margin:0;
    padding:26px 20px;
    border-radius:var(--radius-lg);
    border:1px solid var(--rose-soft);
    background:var(--rose-wash);
    color:var(--rose-deep);
    font-size:15px;
    font-weight:700;
    letter-spacing:.03em;
    line-height:1.7;
  }
  .notice .sub{
    display:block;
    margin-top:6px;
    font-size:13px;
    font-weight:400;
    color:var(--ink-soft);
    letter-spacing:0;
  }

  /* 資訊類卡片：走思庭藕粉色 */
  .card.is-rose{
    --c:      var(--rose);
    --c-deep: var(--rose-deep);
    --c-soft: var(--rose-soft);
    --c-wash: var(--rose-wash);
  }

  /* ---------- LIFF 除錯面板（測試用，之後移除） ---------- */
  .debug{
    margin-top:26px;
    padding:14px 16px;
    border-radius:16px;
    border:1px dashed var(--line);
    background:var(--surface);
    text-align:left;
    font-size:12.5px;
    line-height:1.75;
    color:var(--ink-soft);
    word-break:break-all;
  }
  .debug h2{
    margin:0 0 8px;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.14em;
    color:var(--ink-faint);
  }
  .debug .row{ display:flex; gap:8px; }
  .debug .k{
    flex:0 0 auto;
    min-width:76px;
    color:var(--ink-faint);
  }
  .debug .v{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:12px;
    color:var(--ink);
    /* flex 項目預設 min-width:auto，會被長字串撐開；設 0 才縮得下來 */
    flex:1 1 auto;
    min-width:0;
    word-break:break-all;
    overflow-wrap:anywhere;
  }
  .debug.is-ok{    border-color:var(--blue-soft); background:var(--blue-wash); }
  .debug.is-warn{  border-color:var(--rose-soft); background:var(--rose-wash); }
  .debug.is-error{ border-color:#E8B4B4; background:#FDF0F0; }

  /* ---------- 頁尾 ---------- */
  .foot{
    margin-top:34px;
    text-align:center;
    font-size:12px;
    color:var(--ink-faint);
    letter-spacing:.04em;
  }

  /* ---------- 平板以上：兩欄 ---------- */
  @media (min-width:640px){
    .wrap{ padding-top:54px; }
    .hello{ font-size:30px; }
    .cards{ gap:16px; }
    .card{ padding:32px 16px 30px; min-height:172px; gap:15px; }
    .card .icon{ width:72px; height:72px; border-radius:23px; }
    .card .icon svg{ width:36px; height:36px; }
    .card .title{ font-size:18px; }
  }

  @media (prefers-reduced-motion:reduce){
    .card,.card .icon{ transition:none; }
    .card:hover,.card:active{ transform:none; }
  }
</style>
</head>
<body>

<main class="wrap">

  <!-- 頂部：集團名稱 -->
  <div class="brandbar">
    <span class="dot" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
        <circle cx="12" cy="12" r="3.4"/>
      </svg>
    </span>
    <span>晴暢集團　員工系統</span>
  </div>

  <!-- 頂部：問候 -->
  <h1 class="hello">哈囉 <span class="name" id="userName">載入中…</span><span class="wave">👋</span></h1>
  <p class="subtitle">今天也辛苦了，需要什麼從下面選就好</p>

  <hr class="divider">

  <p class="section-label" id="menuLabel">功能選單</p>

  <!-- 功能卡片：預設全部隱藏，由 JS 依部門開啟 -->
  <div class="cards" id="cards">

    <a class="card" data-fn="預休登記" id="cardPreleave" hidden>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="3"/>
          <path d="M3 10h18M8 3v4M16 3v4"/>
          <path d="M8 14.5h.01M12 14.5h.01M16 14.5h.01M8 18h.01M12 18h.01"/>
        </svg>
      </span>
      <span class="title">預休登記</span>
    </a>

    <button type="button" class="card" data-fn="排班登記" hidden>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="17" rx="3"/>
          <path d="M3 9.5h18M3 15.3h18M9.2 9.5V21"/>
        </svg>
      </span>
      <span class="title">排班登記</span>
    </button>

    <button type="button" class="card" data-fn="請假申請" hidden>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2.5 2.5 0 0 0-2.5 2.5v13A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V8.5z"/>
          <path d="M14 3v4a1.5 1.5 0 0 0 1.5 1.5h4"/>
          <path d="M8.6 15.2l2 2 4-4.4"/>
        </svg>
      </span>
      <span class="title">請假申請</span>
    </button>

    <button type="button" class="card is-rose" data-fn="報表" hidden>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20.5h18"/>
          <path d="M6.6 20.5v-5.6M12 20.5V8.2M17.4 20.5v-8.6"/>
        </svg>
      </span>
      <span class="title">報表</span>
    </button>

    <a class="card is-rose" data-fn="開會內容" href="https://drive.google.com/drive/folders/13xOiqFlEnQ0Gv95SBQBcPmCmPeUL6Hwj"
       target="_blank" rel="noopener noreferrer" hidden>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2a2 2 0 0 1 1.5.7l1.1 1.3h7.2A2.5 2.5 0 0 1 21 9.5v8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/>
          <path d="M3 11h18"/>
        </svg>
      </span>
      <span class="title">開會內容</span>
    </a>

    <a class="card is-rose" data-fn="月中介紹" href="https://complete-noise-cc3.notion.site/311fa751865680cba27bcd161029dc8d"
       target="_blank" rel="noopener noreferrer" hidden>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2.5 2.5 0 0 0-2.5 2.5v13A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V8.5z"/>
          <path d="M14 3v4a1.5 1.5 0 0 0 1.5 1.5h4"/>
          <path d="M12 16.6v-3.1M12 11.1h.01"/>
        </svg>
      </span>
      <span class="title">月中介紹</span>
    </a>

    <button type="button" class="card is-rose" data-fn="門市維護" hidden>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.6 9.6h16.8V19a2 2 0 0 1-2 2H5.6a2 2 0 0 1-2-2z"/>
          <path d="M3.2 9.6 5.3 4h13.4l2.1 5.6"/>
          <path d="M9.6 21v-5.4h4.8V21"/>
        </svg>
      </span>
      <span class="title">門市維護</span>
    </button>

  </div>

  <!-- 查無資料／錯誤提示 -->
  <p class="notice" id="notice" hidden></p>

  <!-- LIFF 測試面板：確認身分有沒有抓到，確認完可整段刪除 -->
  <section class="debug" id="debugBox">
    <h2>LIFF 連線測試</h2>
    <div class="row"><span class="k">狀態</span><span class="v" id="dbgStatus">初始化中…</span></div>
    <div class="row"><span class="k">暱稱</span><span class="v" id="dbgName">—</span></div>
    <div class="row"><span class="k">userId</span><span class="v" id="dbgUid">—</span></div>
    <div class="row"><span class="k">開啟環境</span><span class="v" id="dbgEnv">—</span></div>
    <div class="row"><span class="k">主檔比對</span><span class="v" id="dbgMatch">—</span></div>
  </section>

  <p class="foot">晴暢國際有限公司　內部使用</p>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</main>

<script>
(function(){
  var LIFF_ID    = "2011467420-8ej4byB6";
  var ROSTER_URL = "https://script.google.com/macros/s/AKfycbzitK29DxZdY8GKoWudHUXA8RBFHQBLQ7DUWuJeulM-zLkl7iMRvFYROThJgLVa9oDy/exec?action=getRoster";

  // 管理員：看得到所有功能（不列舉，之後新增卡片會自動包含）
  var ADMIN_DEPT = "管理員";

  // 各部門可見的功能（共通功能另外加；管理員另外處理）
  var DEPT_FUNCTIONS = {
    "行政": ["請假申請"],
    "思庭": ["預休登記", "請假申請", "月中介紹"],
    "妥妥": ["預休登記", "請假申請", "月中介紹"],
    "倫倫": ["排班登記", "請假申請"],
    "老闆": ["報表"]
  };
  var COMMON_FUNCTIONS = ["開會內容", "門市維護"];

  // 預休登記：帶 LIFF 身分連到獨立頁
  var PRELEAVE_URL = "https://siting-lunlun-care.github.io/portal/preleave/";

  var elName   = document.getElementById("userName");
  var elMenu   = document.getElementById("menuLabel");
  var elCards  = document.getElementById("cards");
  var elNotice = document.getElementById("notice");
  var elToast  = document.getElementById("toast");
  var elPre    = document.getElementById("cardPreleave");
  var allCards = [].slice.call(elCards.querySelectorAll(".card"));

  var elBox    = document.getElementById("debugBox");
  var elStatus = document.getElementById("dbgStatus");
  var elDbgName= document.getElementById("dbgName");
  var elUid    = document.getElementById("dbgUid");
  var elEnv    = document.getElementById("dbgEnv");
  var elMatch  = document.getElementById("dbgMatch");

  // 尚未接上的功能，點了給個提示而不是靜悄悄沒反應
  var toastTimer = null;
  function showToast(msg){
    elToast.textContent = msg;
    elToast.classList.add("is-on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ elToast.classList.remove("is-on"); }, 1900);
  }

  document.getElementById("cards").addEventListener("click", function(e){
    var card = e.target.closest ? e.target.closest(".card") : null;
    if (!card) return;
    if (card.tagName === "A" && card.getAttribute("href")) return;  // 已接連結，正常前往
    showToast(card.getAttribute("data-fn") + "　即將推出");
  });

  function setState(cls, status){
    elBox.className = "debug " + cls;
    elStatus.textContent = status;
  }

  // 顯示提示訊息，並把功能區整個收起來
  function showNotice(main, sub){
    allCards.forEach(function(c){ c.hidden = true; });
    elMenu.hidden = true;
    elNotice.hidden = false;
    elNotice.innerHTML = "";
    elNotice.appendChild(document.createTextNode(main));
    if (sub) {
      var s = document.createElement("span");
      s.className = "sub";
      s.textContent = sub;
      elNotice.appendChild(s);
    }
  }

  // 依部門開啟對應卡片
  function renderCards(dept, userId){
    // 管理員 → allow 為 null，代表全部顯示
    var allow = (dept === ADMIN_DEPT)
      ? null
      : (DEPT_FUNCTIONS[dept] || []).concat(COMMON_FUNCTIONS);

    var shown = [];
    allCards.forEach(function(c){
      var on = (allow === null) || allow.indexOf(c.getAttribute("data-fn")) !== -1;
      c.hidden = !on;
      c.classList.remove("is-wide");
      if (on) shown.push(c);
    });
    // 奇數張時最後一張撐滿整列
    if (shown.length % 2 === 1) shown[shown.length - 1].classList.add("is-wide");

    // 預休登記帶上身分參數
    if (!elPre.hidden) {
      elPre.href = PRELEAVE_URL +
        "?uid="  + encodeURIComponent(userId) +
        "&dept=" + encodeURIComponent(dept);
    } else {
      elPre.removeAttribute("href");
    }
    elNotice.hidden = true;
    elMenu.hidden = false;
    return shown.length;
  }

  // 記錄「已嘗試過登入跳轉」，避免登入失敗時來回無限跳轉
  var LOGIN_FLAG = "liff_login_attempted";
  function getFlag(k){   try { return sessionStorage.getItem(k); } catch(e){ return null; } }
  function setFlag(k){   try { sessionStorage.setItem(k, "1"); } catch(e){} }
  function clearFlag(k){ try { sessionStorage.removeItem(k); }  catch(e){} }

  // SDK 沒載到（擋廣告的外掛、離線等）
  if (typeof liff === "undefined") {
    elName.textContent = "訪客";
    setState("is-error", "LIFF SDK 載入失敗，請檢查網路連線");
    showNotice("無法載入登入元件", "請確認網路連線後重新開啟");
    return;
  }

  liff.init({ liffId: LIFF_ID })
    .then(function(){
      elEnv.textContent =
        (liff.isInClient() ? "LINE App 內" : "一般瀏覽器") +
        "　OS:" + liff.getOS() +
        "　v" + liff.getVersion();

      // 未登入（外部瀏覽器開啟）→ 導向 LINE 登入，登入後自動回到本頁
      if (!liff.isLoggedIn()) {
        // 防呆：若登入後回來仍是未登入狀態，就停下來，避免無限跳轉
        if (getFlag(LOGIN_FLAG)) {
          clearFlag(LOGIN_FLAG);
          elName.textContent = "訪客";
          setState("is-error",
            "無法自動登入，請直接用 LINE App 開啟此頁，或關閉無痕模式後再試");
          showNotice("無法自動登入",
            "請直接用 LINE App 開啟此頁，或關閉無痕模式後再試");
          return;
        }
        setFlag(LOGIN_FLAG);
        elName.textContent = "訪客";
        setState("is-warn", "尚未登入，導向 LINE 登入中…");
        liff.login();   // 跳轉離開本頁，之後的程式不會執行
        return;
      }

      clearFlag(LOGIN_FLAG);

      return liff.getProfile().then(function(profile){
        elDbgName.textContent = profile.displayName;
        elUid.textContent     = profile.userId;
        setState("is-warn", "已取得 LINE 身分，比對員工主檔中…");

        // 用 userId 比對員工主檔
        return fetch(ROSTER_URL, { method: "GET" })
          .then(function(res){
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(function(roster){
            if (!Array.isArray(roster)) throw new Error("回傳格式不是陣列");

            // 試算表欄位可能夾帶前後空白，一律去掉再比對
            function clean(v){ return (v == null ? "" : String(v)).trim(); }

            var me = null;
            for (var i = 0; i < roster.length; i++) {
              var r = roster[i];
              if (r && clean(r.userId) === clean(profile.userId)) {
                me = { name: clean(r.name), dept: clean(r.dept), area: clean(r.area) };
                break;
              }
            }

            // 不在名單
            if (!me) {
              elName.textContent  = "訪客";
              elMatch.textContent = "查無此 userId（名單共 " + roster.length + " 筆）";
              setState("is-error", "查無您的資料");
              showNotice("查無您的資料，請聯繫行政",
                "若您已在職，請將上方的 userId 提供給行政人員登錄");
              return;
            }

            // 比對成功 → 用主檔姓名打招呼、依部門開卡片
            elName.textContent  = me.name;
            elMatch.textContent = me.name + "／" + me.dept + (me.area ? "／" + me.area : "");
            var n = renderCards(me.dept, clean(profile.userId));
            setState("is-ok", "比對成功 ✓　部門：" + me.dept + "　功能 " + n + " 項");
          })
          .catch(function(err){
            elName.textContent = "訪客";
            setState("is-error", "讀取員工名單失敗：" + (err && err.message || err));
            showNotice("無法讀取員工名單", "請稍後再試，或聯繫行政");
          });
      })
      .catch(function(err){
        elName.textContent = "訪客";
        setState("is-error", "getProfile 失敗：" + (err && (err.message || err.code) || err));
        showNotice("無法取得您的 LINE 身分", "請重新從 LINE 開啟此頁");
      });
    })
    .catch(function(err){
      elName.textContent = "訪客";
      elEnv.textContent  = "—";
      setState("is-error", "liff.init 失敗：" + (err && (err.message || err.code) || err));
      showNotice("系統初始化失敗", "請稍後再試，或聯繫行政");
    });
})();
</script>

</body>
</html>
